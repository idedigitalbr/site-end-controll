name: endcontrol
services:
  media-import:
    image: endcontrol-next:${RELEASE_ID:?release required}
    profiles: [tools]
    env_file: .env.app
    environment:
      DATABASE_URL: ${LOCAL_IMPORT_DATABASE_URL:?local import URL required}
    network_mode: service:db
  db:
    image: mysql:8.4
    container_name: endcontrol-cms-db
    restart: unless-stopped
    env_file: .env.db
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40"]
    volumes:
      - cms-db:/var/lib/mysql
    networks: [default]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
  web:
    image: endcontrol-next:${RELEASE_ID:?release required}
    container_name: endcontrol-web
    restart: unless-stopped
    env_file: .env.app
    volumes:
      - cms-media:/app/storage/media
    networks: [default, proxy]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.endcontrol-router.rule: Host(`endcontrol.suporteide.digital`)
      traefik.http.routers.endcontrol-router.entrypoints: websecure
      traefik.http.routers.endcontrol-router.tls: "true"
      traefik.http.routers.endcontrol-router.tls.certresolver: letsencrypt
      traefik.http.services.endcontrol-service.loadbalancer.server.port: "3000"
networks:
  proxy:
    external: true
volumes:
  cms-db:
    name: endcontrol_cms_db
  cms-media:
    name: endcontrol_cms_media
