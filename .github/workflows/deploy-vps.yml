name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-endcontrol
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run automated tests
        run: node --test tests/*.test.js

      - name: Run site integrity checks
        shell: pwsh
        run: ./tests/site-integrity.ps1

      - name: Configure SSH and Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          ssh-keyscan -p "$VPS_PORT" -t rsa,ecdsa,ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add - <<< "$VPS_SSH_KEY"
          
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER"@"$VPS_HOST" <<'REMOTE'
          set -e
          
          PROJECT_DIR="/opt/endcontrol-site/app"
          
          RESOLVED_DIR=$(realpath "$PROJECT_DIR")
          if [ "$RESOLVED_DIR" = "/" ] || [ "$RESOLVED_DIR" = "/opt" ] || [ "$RESOLVED_DIR" = "/var" ] || [ "$RESOLVED_DIR" = "/home" ] || [ "$RESOLVED_DIR" = "/root" ] || [ -z "$RESOLVED_DIR" ]; then
            echo "ABORTAR: Diretório inválido!" >&2
            exit 99
          fi
          
          cd "$RESOLVED_DIR"
          
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          
          docker compose up -d --build --remove-orphans
          
          REMOTE
